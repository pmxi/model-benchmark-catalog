<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AI model benchmark results and their original source evidence."
    />
    <title>Model benchmark catalog</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="header-main">
        <a class="brand" href="#results">Model benchmark catalog</a>
        <div class="header-actions">
          <span id="connection-status" class="connection-status" role="status"
            >Connecting</span
          >
          <button class="button" id="refresh" title="Reload catalog data">
            Refresh
          </button>
        </div>
      </div>
      <nav aria-label="Main navigation">
        <a href="#explorer" data-nav="explorer">Benchmark explorer</a>
        <a href="#results" data-nav="results"
          >All results <span id="nav-count" class="nav-count"></span
        ></a>
        <a href="#models" data-nav="models">Models</a>
        <a href="#sources" data-nav="sources">Sources</a>
      </nav>
    </header>
    <main id="content" tabindex="-1">
      <div id="initial-state" class="loading-state" role="status">
        <h1>Opening the catalog</h1>
        <p>Reading models, results, and source evidence.</p>
      </div>
      <div id="app" hidden>
        <div class="page-heading">
          <div>
            <h1 id="page-title">All results</h1>
            <p id="page-description">
              Reported results and the sources behind them.
            </p>
          </div>
          <button class="button primary" id="export">Export CSV</button>
        </div>
        <div class="filterbar">
          <label class="searchbox">
            <span>Search</span>
            <input
              id="search"
              type="search"
              placeholder="Models, benchmarks, sources"
              aria-label="Search catalog"
            />
          </label>
          <label class="organization-filter">
            <span>Organization</span>
            <select id="organization" aria-label="Filter by organization">
              <option value="">All organizations</option>
            </select>
          </label>
          <button class="text-button" id="clear-filters" hidden>
            Clear filters
          </button>
        </div>
        <div id="view" aria-live="polite"></div>
        <footer class="main-footer">
          <span>Local catalog · Read only</span>
          <span id="snapshot-time"></span>
        </footer>
      </div>
    </main>
    <dialog id="detail" aria-labelledby="detail-title">
      <div class="dialog-top">
        <span>Source evidence</span>
        <button class="button" id="close-detail">Close</button>
      </div>
      <div id="detail-body"></div>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
